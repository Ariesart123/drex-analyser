# Single-Worker mode: the Worker serves BOTH the API and the built site (no Vercel). Deploy with: npm run deploy:full
name = "drex-analyser"
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "drex-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[vars]
APP_URL = "https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev"
